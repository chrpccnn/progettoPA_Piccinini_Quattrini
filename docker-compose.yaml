services:
  # Database MySQL utilizzato dall'applicazione.
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_USER: ${MSQLUSR}
      MYSQL_PASSWORD: ${MSQLPSW}
      MYSQL_DATABASE: ${MSQLDB}
      MYSQL_ROOT_PASSWORD: ${MSQLROOTPSW}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Verifica che MySQL sia raggiungibile prima di avviare il backend.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Backend Node.js che espone le API dell'applicazione.
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Usa il nome del servizio MySQL come host nella rete Docker.
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    # Monta il codice sorgente locale nel container per facilitarne lo sviluppo.
    volumes:
      - ./src:/app/src

# Volume persistente per conservare i dati del database tra i riavvii.
volumes:
  mysql_data: