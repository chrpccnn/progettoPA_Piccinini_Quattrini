services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_USER: ${MSQLUSR}
      MYSQL_PASSWORD: ${MSQLPSW}
      MYSQL_DATABASE: ${MSQLDB}
      MYSQL_ROOT_PASSWORD: ${MSQLROOTPSW}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data: