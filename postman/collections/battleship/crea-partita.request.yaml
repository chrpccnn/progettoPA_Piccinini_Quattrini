$kind: http-request
url: 'http://localhost:3000/game/'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mode": "ai"
    }
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const jsonData = pm.response.json();
      if (jsonData.id) {
          pm.collectionVariables.set("game_id", jsonData.id);
          console.log("Game ID salvato:", jsonData.id);
      }
