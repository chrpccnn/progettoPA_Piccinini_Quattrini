$kind: http-request
url: 'http://localhost:3000/game/{{game_id}}/state'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt_token}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - partita trovata nel DB", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La risposta contiene l'ID della partita", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData.id).to.eql(pm.collectionVariables.get("game_id"));
      });

      pm.test("La partita ha uno stato valido", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("state");
      });
